name: Personal Build

# Builds a signed APK of this customized fork.
#
# Trigger manually from the Actions tab, or automatically on every push to the
# personal-build branch. Each build publishes a NEW release whose patch version
# is incremented automatically, so past releases are kept and can be downloaded
# again at any time.
#
# Signing is done explicitly with apksigner instead of through Gradle's
# signingConfig: Gradle's packageRelease task hung on CI (it never completed,
# while packageDebug took 40s), and signing outside Gradle gives clear output.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 3.0.0-personal). Leave empty to auto-increment the patch (2.7.3 -> 2.7.4)."
        required: false
        default: ""
  push:
    branches:
      - personal-build

permissions:
  contents: write

# Never let two builds race while computing the next version number
concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Work out the version for this build.
      #   - Manual input wins (use this for a major/minor bump, e.g. 3.0.0-personal)
      #   - Otherwise take the highest existing *-personal tag and bump the patch
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SEED="2.7.3"   # used only when no *-personal tag exists yet

          if [ -n "${MANUAL_VERSION:-}" ]; then
            VERSION="${MANUAL_VERSION#v}"          # tolerate a leading "v"
            echo "Using manually specified version: $VERSION"
          else
            LAST=$(gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' 2>/dev/null \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+-personal$' \
              | sed -E 's/^v//; s/-personal$//' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1 || true)

            if [ -z "$LAST" ]; then
              VERSION="${SEED}-personal"
              echo "No previous *-personal tag found, starting from $VERSION"
            else
              MAJOR=$(echo "$LAST" | cut -d. -f1)
              MINOR=$(echo "$LAST" | cut -d. -f2)
              PATCH=$(echo "$LAST" | cut -d. -f3)
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-personal"
              echo "Previous version $LAST -> next $VERSION"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "### Version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Built WITHOUT the signingConfig (no KEYSTORE_FILE is exported here),
      # so Gradle produces an unsigned release APK and never blocks on signing.
      - name: Build release APK (unsigned)
        timeout-minutes: 30
        env:
          JELLYFIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :app:assembleLibreRelease --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3072m -Djava.security.egd=file:/dev/urandom"

      - name: Build debug APK
        timeout-minutes: 15
        env:
          JELLYFIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :app:assembleLibreDebug --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3072m -Djava.security.egd=file:/dev/urandom"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "Keystore decoded: $(stat -c%s "$RUNNER_TEMP/keystore.jks") bytes"

      - name: Sign release APK
        timeout-minutes: 10
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"

          UNSIGNED=$(find app/build/outputs/apk/libre/release -name "*.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK produced"; exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"

          mkdir -p build/personal-output
          OUT="build/personal-output/$(basename "${UNSIGNED/-unsigned/}")"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"

          echo "Signed APK: $OUT"
          "$BT/apksigner" verify --print-certs "$OUT"

      - name: Collect debug APK
        if: always()
        run: |
          mkdir -p build/personal-output
          find app/build/outputs/apk/libre/debug -name "*.apk" \
            -exec cp {} build/personal-output/ \; 2>/dev/null || true
          ls -lh build/personal-output/ || true
          echo "=== SHA-256 ==="
          sha256sum build/personal-output/*.apk 2>/dev/null | tee build/personal-output/SHA256SUMS.txt || true

      # Artifact: visible only under this specific run, requires being logged in.
      - name: Upload APKs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-android-personal
          retention-days: 30
          if-no-files-found: warn
          path: build/personal-output/*.apk

      # Release: one per build, kept forever. The tag is never reused, so
      # previously published releases stay downloadable.
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Re-run with an explicit higher version."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Jellyfin Android ${VERSION}" \
            --notes "自定义版 Jellyfin Android（基于官方 v2.7.3）。

          ## 下载
          - \`jellyfin-android-*-libre-release.apk\` —— **装这个**（已签名，8.6 MB）
          - \`jellyfin-android-*-libre-debug.apk\` —— debug 版，带日志（33 MB）
          - \`SHA256SUMS.txt\` —— 校验值

          ## 改动内容
          - 连接：接受版本较旧/被改名的服务器（如飞牛 NAS 的 Jellyfin 10.8.12）
          - 播放：声明 mov 容器并显式指定 MIME 类型，修复 .mov 黑屏
          - 界面：快进/快退按钮（可设 5/10/20/30 秒），倍速支持 3x/4x/5x
          - 界面：底栏含锁屏/更多/倍速，次要按钮收进\"更多\"面板
          - 界面：工具栏手动旋转按钮；控制栏操作时不再自动消失

          ## 安装
          与历史版本使用同一签名，可直接覆盖安装。
          签名 SHA-256: \`53b3f5149855e25da144153345b66835f0889562553c81adbaeeb354233862b8\`

          > 构建自 ${REPO} 的 \`personal-build\` 分支（commit ${GITHUB_SHA:0:7}）" \
            build/personal-output/*.apk build/personal-output/SHA256SUMS.txt

          echo "Release published:"
          gh release view "$TAG" --repo "$REPO" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'

          echo "### Release: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
